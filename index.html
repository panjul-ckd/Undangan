<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Foto Pro - Preview A4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --a4-width: 600px; --a4-ratio: 1.414; }
        body { font-family: 'Segoe UI', sans-serif; background: #e9ecef; margin: 0; padding: 20px; display: flex; gap: 20px; }
        
        /* Panel Kontrol (Kiri) */
        .sidebar { width: 350px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); height: fit-content; }
        
        /* Area Preview Kertas (Kanan) */
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .paper-a4 { 
            width: var(--a4-width); 
            height: calc(var(--a4-width) * var(--a4-ratio)); 
            background: white; 
            box-shadow: 0 0 20px rgba(0,0,0,0.2); 
            position: relative; 
            padding: 20px; /* Simulasi Margin Kertas */
            box-sizing: border-box;
            overflow: hidden;
        }

        .controls { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-print { background: #28a745; color: white; }
        .btn-clear { background: #dc3545; color: white; }
        
        /* Styling Foto di dalam Kertas */
        .preview-photo {
            position: absolute;
            outline: 1px solid #eee;
            background-size: cover;
            background-position: center;
        }

        h2 { margin-top: 0; color: #1a73e8; border-bottom: 2px solid #eee; pb: 10px; }
        label { font-size: 14px; font-weight: bold; color: #555; }
        select, input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>⚙️ Pengaturan</h2>
    <div class="controls">
        <label>1. Pilih Ukuran:</label>
        <select id="size" onchange="updatePreview()">
            <optgroup label="Pas Foto">
                <option value="2x3">2 x 3 cm</option>
                <option value="3x4" selected>3 x 4 cm</option>
                <option value="4x6">4 x 6 cm</option>
            </optgroup>
            <optgroup label="Ukuran Besar">
                <option value="3R">3R (8.9x12.7 cm)</option>
                <option value="4R">4R (10.2x15.2 cm)</option>
                <option value="8R">8R (20.3x25.4 cm)</option>
            </optgroup>
        </select>

        <label>2. Upload Foto:</label>
        <input type="file" id="upload" accept="image/*" multiple onchange="handleUpload(event)">
        
        <button class="btn btn-print" onclick="generatePDF()">📥 Download PDF (A4)</button>
        <button class="btn btn-clear" onclick="clearAll()">🗑️ Hapus Semua</button>
    </div>
    <p style="font-size: 12px; color: #888; margin-top: 20px;">* Foto akan disusun otomatis memenuhi kertas A4.</p>
</div>

<div class="main-content">
    <h3 style="margin-top:0">Tampilan Sebelum Dicetak (A4)</h3>
    <div id="paper" class="paper-a4"></div>
</div>

<canvas id="tempCanvas" style="display:none;"></canvas>

<script>
    let photoList = [];
    const sizes = {
        '2x3': {w: 21, h: 30}, '3x4': {w: 28, h: 38}, '4x6': {w: 38, h: 56},
        '3R':  {w: 89, h: 127}, '4R':  {w: 102, h: 152}, '8R':  {w: 203, h: 254}
    };

    function handleUpload(event) {
        const files = event.target.files;
        for (let file of files) {
            const reader = new FileReader();
            reader.onload = (e) => {
                photoList.push(e.target.result);
                updatePreview();
            };
            reader.readAsDataURL(file);
        }
    }

    function updatePreview() {
        const paper = document.getElementById('paper');
        paper.innerHTML = ''; // Reset kertas
        
        const selectedSize = sizes[document.getElementById('size').value];
        const containerWidth = paper.offsetWidth - 40; // Kurangi padding
        const scaleFactor = containerWidth / 210; // Rasio mm ke pixel preview

        let curX = 20; // Mulai dari padding kertas
        let curY = 20;
        const spacing = 5 * scaleFactor;

        photoList.forEach((src) => {
            const wPx = selectedSize.w * scaleFactor;
            const hPx = selectedSize.h * scaleFactor;

            if (curX + wPx > paper.offsetWidth - 20) {
                curX = 20;
                curY += hPx + spacing;
            }

            const imgDiv = document.createElement('div');
            imgDiv.className = 'preview-photo';
            imgDiv.style.width = wPx + 'px';
            imgDiv.style.height = hPx + 'px';
            imgDiv.style.left = curX + 'px';
            imgDiv.style.top = curY + 'px';
            imgDiv.style.backgroundImage = `url(${src})`;
            
            paper.appendChild(imgDiv);
            curX += wPx + spacing;
        });
    }

    function clearAll() {
        photoList = [];
        updatePreview();
        document.getElementById('upload').value = '';
    }

    async function generatePDF() {
        if (photoList.length === 0) return alert("Upload foto dulu!");
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const selectedSize = sizes[document.getElementById('size').value];
        
        let curX = 10; let curY = 10;
        for (let photo of photoList) {
            const img = await createCroppedImg(photo, selectedSize.w, selectedSize.h);
            if (curX + selectedSize.w > 200) { curX = 10; curY += selectedSize.h + 5; }
            if (curY + selectedSize.h > 280) { pdf.addPage(); curX = 10; curY = 10; }
            pdf.addImage(img, 'JPEG', curX, curY, selectedSize.w, selectedSize.h);
            curX += selectedSize.w + 5;
        }
        pdf.save("hasil-cetak.pdf");
    }

    function createCroppedImg(base64, tw, th) {
        return new Promise((resolve) => {
            const canvas = document.getElementById('tempCanvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                canvas.width = (tw / 10) * 118; canvas.height = (th / 10) * 118;
                const scale = Math.max(canvas.width/img.width, canvas.height/img.height);
                const x = (canvas.width/2)-(img.width/2)*scale;
                const y = (canvas.height/2)-(img.height/2)*scale;
                ctx.fillStyle = "white"; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.drawImage(img, x, y, img.width*scale, img.height*scale);
                resolve(canvas.toDataURL('image/jpeg', 0.9));
            };
            img.src = base64;
        });
    }
</script>

</body>
</html>
